# Dummy two-container project for agentbox tests (busybox httpd; see docs/decisions.md).
services:
  web:
    image: docker.io/library/busybox:1.36
    command: ["sh", "-c", "mkdir -p /www && echo dummy-web > /www/index.html && exec httpd -f -p 8080 -h /www"]
    env_file: .env
    labels:
      - agentbox-test=1
  worker:
    image: docker.io/library/busybox:1.36
    command: ["sh", "-c", "while true; do wget -q -O - http://web:8080/ || true; sleep 30; done"]
    labels:
      - agentbox-test=1
