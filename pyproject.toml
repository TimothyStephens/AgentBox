# Metadata and lint configuration only: agentbox runs from the checkout (`make install` puts a launcher on
# PATH) and has no runtime dependencies beyond the standard library.
[project]
name = "agentbox"
version = "0.0.0"
description = "Coding agents in hardened rootless podman sandboxes"
requires-python = ">=3.11"     # tomllib
dependencies = []

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "B", "UP"]
ignore = ["E741", "E731", "B904", "B905", "B023", "E501", "UP031"]   # UP031: %-formatting is style, not a defect

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["F841"]
